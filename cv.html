<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GAEKS ATS CV Studio | Executive Resume Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="auth.js?v=20260914_09"></script>

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .cv-font { font-family: 'Inter', sans-serif; }

    /* A4 PAGE SPECIFICATION FOR SCREEN & PRINT */
    .a4-sheet {
      width: 210mm;
      min-height: 297mm;
      box-sizing: border-box;
      background: #ffffff;
      color: #0f172a;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
    }

    /* THEME SYSTEM */
    .theme-apex { --accent: #1e3a8a; --accent-light: #eff6ff; --accent-border: #bfdbfe; }
    .theme-swiss { --accent: #0f172a; --accent-light: #f8fafc; --accent-border: #cbd5e1; }
    .theme-silicon { --accent: #047857; --accent-light: #f0fdf4; --accent-border: #bbf7d0; }
    .theme-modern { --accent: #4338ca; --accent-light: #eef2ff; --accent-border: #c7d2fe; }

    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: #0f172a; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: #475569; }

    @media print {
      body { background: white !important; color: black !important; padding: 0 !important; margin: 0 !important; }
      .no-print { display: none !important; }
      #preview-container { padding: 0 !important; margin: 0 !important; }
      .a4-sheet {
        box-shadow: none !important;
        margin: 0 !important;
        width: 100% !important;
        min-height: auto !important;
        page-break-after: always;
      }
      @page { size: A4 portrait; margin: 12mm 15mm; }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-blue-600 selection:text-white">

  <!-- TOP NAVBAR -->
  <header class="no-print sticky top-0 z-50 w-full backdrop-blur-md bg-slate-950/90 border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
      
      <!-- BRAND & NAV -->
      <div class="flex items-center space-x-3">
        <a href="index.html" class="text-xs font-semibold text-slate-400 hover:text-white flex items-center gap-1.5 py-1.5 px-2.5 rounded-lg hover:bg-slate-900 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
          <span>Beranda</span>
        </a>
        <span class="text-slate-800">|</span>
        <div class="flex items-center space-x-2">
          <span class="font-extrabold text-base sm:text-lg bg-gradient-to-r from-blue-400 to-indigo-300 bg-clip-text text-transparent">
            GAEKS ATS Studio
          </span>
          <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-blue-950 text-blue-300 border border-blue-800">
            v2.0 Direct Editor
          </span>
        </div>
      </div>

      <!-- ACTIONS -->
      <div class="flex items-center space-x-2">
        <button type="button" onclick="createNewCV()" id="btn-create-new-cv" class="px-3 py-1.5 text-xs font-bold rounded-lg bg-blue-600 hover:bg-blue-500 text-white transition flex items-center gap-1.5 shadow-sm shadow-blue-600/30 cursor-pointer">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
          <span>+ Buat CV Baru</span>
        </button>

        <button type="button" onclick="loadSampleDeny()" class="hidden sm:flex px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-700 transition items-center gap-1 cursor-pointer">
          <span>📋 Sampel CEO</span>
        </button>

        <button type="button" onclick="window.print()" class="px-3.5 py-1.5 text-xs font-bold rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white transition shadow-sm flex items-center gap-1.5 cursor-pointer">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
          <span>Download PDF</span>
        </button>

        <!-- AUTH STATUS PILL -->
        <div id="nav-auth-container" class="flex items-center pl-2">
          <a href="login.html?redirect=cv.html" id="btn-login" class="px-3 py-1.5 text-xs font-bold rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-700 text-slate-200 transition">
            Masuk / Sign In
          </a>
          <div id="user-pill" class="hidden flex items-center space-x-2">
            <a href="profile.html" class="flex items-center space-x-2 p-1 pr-2.5 rounded-full bg-slate-900 border border-slate-700 hover:border-blue-500 transition">
              <img id="user-avatar" class="w-6 h-6 rounded-full object-cover" src="" alt="User" />
              <span id="user-name" class="text-xs font-semibold text-slate-200 max-w-[100px] truncate">User</span>
              <span class="px-1.5 py-0.2 rounded-full text-[9px] font-extrabold bg-blue-950 text-blue-300 border border-blue-800">VIP</span>
            </a>
          </div>
        </div>
      </div>

    </div>
  </header>

  <!-- MAIN WORKSPACE: 2-COLUMN SPLIT (EDITOR FORM & LIVE A4 PREVIEW) -->
  <main class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 py-6 grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
    
    <!-- LEFT PANEL: FORM BUILDER (5 COLUMNS) -->
    <section class="no-print lg:col-span-5 bg-slate-900/90 border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col gap-5 sticky top-20 max-h-[calc(100vh-6rem)] overflow-y-auto custom-scroll">
      
      <!-- SUBBAR INFO -->
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span id="save-status" class="text-xs font-medium text-slate-400">Tersimpan Otomatis</span>
        </div>
        
        <!-- THEME SELECTOR -->
        <div class="flex items-center gap-1.5">
          <span class="text-[11px] text-slate-500 font-medium">Tema:</span>
          <select id="theme-selector" onchange="changeTheme(this.value)" class="text-xs bg-slate-800 border border-slate-700 text-slate-200 rounded px-2 py-1 outline-none">
            <option value="theme-apex">Apex Executive</option>
            <option value="theme-swiss">Swiss Minimalist</option>
            <option value="theme-silicon">Silicon Tech</option>
            <option value="theme-modern">Modern Indigo</option>
          </select>
        </div>
      </div>

      <!-- FORM NAVIGATION TABS -->
      <div class="flex space-x-1 p-1 bg-slate-950 rounded-xl border border-slate-800 overflow-x-auto text-xs font-semibold">
        <button type="button" onclick="switchTab('profile')" id="tab-btn-profile" class="tab-btn px-3 py-1.5 rounded-lg bg-blue-600 text-white transition flex-1 text-center whitespace-nowrap">Profil</button>
        <button type="button" onclick="switchTab('experience')" id="tab-btn-experience" class="tab-btn px-3 py-1.5 rounded-lg text-slate-400 hover:text-white transition flex-1 text-center whitespace-nowrap">Pengalaman</button>
        <button type="button" onclick="switchTab('education')" id="tab-btn-education" class="tab-btn px-3 py-1.5 rounded-lg text-slate-400 hover:text-white transition flex-1 text-center whitespace-nowrap">Pendidikan</button>
        <button type="button" onclick="switchTab('skills')" id="tab-btn-skills" class="tab-btn px-3 py-1.5 rounded-lg text-slate-400 hover:text-white transition flex-1 text-center whitespace-nowrap">Keahlian</button>
      </div>

      <!-- TAB 1: PROFIL -->
      <div id="tab-content-profile" class="tab-content space-y-3.5">
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">Nama Lengkap & Gelar</label>
          <input type="text" id="f-name" oninput="updateCvData()" placeholder="Contoh: Deny Triawan, S.T." class="w-full px-3 py-2 text-xs bg-slate-950 border border-slate-800 rounded-lg text-white focus:border-blue-500 focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">Target Posisi / Profesi</label>
          <input type="text" id="f-title" oninput="updateCvData()" placeholder="Contoh: Chief Executive Officer / Head of Logistics" class="w-full px-3 py-2 text-xs bg-slate-950 border border-slate-800 rounded-lg text-white focus:border-blue-500 focus:outline-none" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] font-medium text-slate-400 mb-1">Email</label>
            <input type="email" id="f-email" oninput="updateCvData()" placeholder="deny@gaeks.com" class="w-full px-3 py-1.5 text-xs bg-slate-950 border border-slate-800 rounded-lg text-white focus:border-blue-500 focus:outline-none" />
          </div>
          <div>
            <label class="block text-[11px] font-medium text-slate-400 mb-1">No. WhatsApp / Telepon</label>
            <input type="text" id="f-phone" oninput="updateCvData()" placeholder="+62 812-3456-7890" class="w-full px-3 py-1.5 text-xs bg-slate-950 border border-slate-800 rounded-lg text-white focus:border-blue-500 focus:outline-none" />
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] font-medium text-slate-400 mb-1">Domisili / Kota</label>
            <input type="text" id="f-location" oninput="updateCvData()" placeholder="Jakarta, Indonesia" class="w-full px-3 py-1.5 text-xs bg-slate-950 border border-slate-800 rounded-lg text-white focus:border-blue-500 focus:outline-none" />
          </div>
          <div>
            <label class="block text-[11px] font-medium text-slate-400 mb-1">LinkedIn URL</label>
            <input type="text" id="f-linkedin" oninput="updateCvData()" placeholder="linkedin.com/in/username" class="w-full px-3 py-1.5 text-xs bg-slate-950 border border-slate-800 rounded-lg text-white focus:border-blue-500 focus:outline-none" />
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">Ringkasan Profesional (Executive Summary)</label>
          <textarea id="f-summary" rows="4" oninput="updateCvData()" placeholder="Tuliskan 2-3 kalimat mengenai pengalaman kepemimpinan, pencapaian kunci, dan nilai tambah strategis Anda..." class="w-full px-3 py-2 text-xs bg-slate-950 border border-slate-800 rounded-lg text-white focus:border-blue-500 focus:outline-none leading-relaxed custom-scroll"></textarea>
        </div>
      </div>

      <!-- TAB 2: PENGALAMAN KERJA -->
      <div id="tab-content-experience" class="tab-content hidden space-y-4">
        <div class="flex justify-between items-center">
          <span class="text-xs font-bold text-slate-300">Riwayat Karir & Pencapaian</span>
          <button type="button" onclick="addExperienceField()" class="text-xs px-2.5 py-1 bg-blue-600/20 text-blue-400 border border-blue-600/40 rounded-lg hover:bg-blue-600 hover:text-white transition font-bold cursor-pointer">+ Tambah Karir</button>
        </div>
        <div id="experience-list-container" class="space-y-4"></div>
      </div>

      <!-- TAB 3: PENDIDIKAN -->
      <div id="tab-content-education" class="tab-content hidden space-y-4">
        <div class="flex justify-between items-center">
          <span class="text-xs font-bold text-slate-300">Riwayat Pendidikan</span>
          <button type="button" onclick="addEducationField()" class="text-xs px-2.5 py-1 bg-blue-600/20 text-blue-400 border border-blue-600/40 rounded-lg hover:bg-blue-600 hover:text-white transition font-bold cursor-pointer">+ Tambah Pendidikan</button>
        </div>
        <div id="education-list-container" class="space-y-4"></div>
      </div>

      <!-- TAB 4: KEAHLIAN & SERTIFIKASI -->
      <div id="tab-content-skills" class="tab-content hidden space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">Keahlian Utama & Teknis (Pisahkan dengan koma)</label>
          <textarea id="f-skills" rows="3" oninput="updateCvData()" placeholder="Freight Forwarding, Customs Brokerage (PPJK), ERP Integration, Supply Chain Management, Team Leadership" class="w-full px-3 py-2 text-xs bg-slate-950 border border-slate-800 rounded-lg text-white focus:border-blue-500 focus:outline-none leading-relaxed"></textarea>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">Sertifikasi & Lisensi Resmi</label>
          <textarea id="f-certifications" rows="2" oninput="updateCvData()" placeholder="Sertifikasi Ahli Kepabeanan (PPJK), Supply Chain Professional (CSCP)" class="w-full px-3 py-2 text-xs bg-slate-950 border border-slate-800 rounded-lg text-white focus:border-blue-500 focus:outline-none leading-relaxed"></textarea>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">Penguasaan Bahasa</label>
          <input type="text" id="f-languages" oninput="updateCvData()" placeholder="Bahasa Indonesia (Penutur Asli), Bahasa Inggris (Profesional)" class="w-full px-3 py-2 text-xs bg-slate-950 border border-slate-800 rounded-lg text-white focus:border-blue-500 focus:outline-none" />
        </div>
      </div>

    </section>

    <!-- RIGHT PANEL: LIVE A4 ATS CANVAS (7 COLUMNS) -->
    <section class="lg:col-span-7 flex justify-center items-start w-full overflow-x-auto p-2" id="preview-container">
      <div id="a4-sheet" class="a4-sheet theme-apex p-10 sm:p-12 cv-font transition-all duration-300">
        
        <!-- SHEET HEADER: NAMA & KONTAK -->
        <header class="border-b-2 border-slate-200 pb-5 mb-5 text-center sm:text-left flex flex-col sm:flex-row sm:items-center justify-between gap-4">
          <div>
            <h1 id="r-name" class="text-3xl sm:text-4xl font-black text-slate-900 tracking-tight uppercase mb-1">NAMA LENGKAP ANDA</h1>
            <p id="r-title" class="text-base sm:text-lg font-bold text-[var(--accent)] tracking-wide">Target Posisi / Profesi</p>
          </div>
          <div id="r-contact" class="text-xs text-slate-600 space-y-1 sm:text-right font-medium"></div>
        </header>

        <!-- SHEET SECTION: RINGKASAN EKSEKUTIF -->
        <section id="sec-summary" class="mb-5">
          <h2 class="text-xs font-black uppercase tracking-widest text-[var(--accent)] border-b border-[var(--accent-border)] pb-1 mb-2">Ringkasan Profesional</h2>
          <p id="r-summary" class="text-xs leading-relaxed text-slate-700 text-justify"></p>
        </section>

        <!-- SHEET SECTION: PENGALAMAN KERJA -->
        <section id="sec-experience" class="mb-5">
          <h2 class="text-xs font-black uppercase tracking-widest text-[var(--accent)] border-b border-[var(--accent-border)] pb-1 mb-2.5">Pengalaman Kerja</h2>
          <div id="r-experience-list" class="space-y-4"></div>
        </section>

        <!-- SHEET SECTION: PENDIDIKAN -->
        <section id="sec-education" class="mb-5">
          <h2 class="text-xs font-black uppercase tracking-widest text-[var(--accent)] border-b border-[var(--accent-border)] pb-1 mb-2.5">Pendidikan</h2>
          <div id="r-education-list" class="space-y-3"></div>
        </section>

        <!-- SHEET SECTION: KEAHLIAN & SERTIFIKASI -->
        <section id="sec-skills" class="mb-4">
          <h2 class="text-xs font-black uppercase tracking-widest text-[var(--accent)] border-b border-[var(--accent-border)] pb-1 mb-2">Keahlian & Kompetensi</h2>
          <div class="text-xs text-slate-700 leading-relaxed space-y-1.5">
            <div id="r-skills-row"><strong class="font-bold text-slate-900">Keahlian Utama:</strong> <span id="r-skills"></span></div>
            <div id="r-cert-row"><strong class="font-bold text-slate-900">Sertifikasi:</strong> <span id="r-certifications"></span></div>
            <div id="r-lang-row"><strong class="font-bold text-slate-900">Bahasa:</strong> <span id="r-languages"></span></div>
          </div>
        </section>

      </div>
    </section>

  </main>

  <script>
    // =========================================================================
    // GAEKS ATS CV STUDIO - PRODUCTION DIRECT ENGINE
    // =========================================================================

    // MODEL DATA RESUME
    let currentResume = {
      name: "",
      title: "",
      email: "",
      phone: "",
      location: "",
      linkedin: "",
      summary: "",
      skills: "",
      certifications: "",
      languages: "",
      theme: "theme-apex",
      experiences: [],
      educations: []
    };

    // SESSION-ISOLATED STORAGE KEY
    function getStorageKey() {
      try {
        const user = typeof GaeksAuth !== 'undefined' ? GaeksAuth.getCurrentUser() : null;
        if (!user) return 'gaeks_cv_guest_v2';
        if (user.email && (user.email.toLowerCase() === 'triawan25@gmail.com' || user.email.toLowerCase() === 'gaeks.group@gmail.com')) {
          return 'gaeks_cv_private_triawan_v2';
        }
        return 'gaeks_cv_user_' + user.id + '_v2';
      } catch (e) {
        return 'gaeks_cv_guest_v2';
      }
    }

    // INIT RESUME ENGINE
    document.addEventListener('DOMContentLoaded', () => {
      initAuthNavbar();
      loadSavedResume();
    });

    function initAuthNavbar() {
      try {
        const user = typeof GaeksAuth !== 'undefined' ? GaeksAuth.getCurrentUser() : null;
        const btnLogin = document.getElementById('btn-login');
        const userPill = document.getElementById('user-pill');
        if (user) {
          if (btnLogin) btnLogin.classList.add('hidden');
          if (userPill) userPill.classList.remove('hidden');
          const avatar = document.getElementById('user-avatar');
          const name = document.getElementById('user-name');
          if (avatar && user.avatar) avatar.src = user.avatar;
          if (name && user.name) name.innerText = user.name;
        } else {
          if (btnLogin) btnLogin.classList.remove('hidden');
          if (userPill) userPill.classList.add('hidden');
        }
      } catch (e) {
        console.warn("Auth check: ", e);
      }
    }

    // LOAD DARI STORAGE ATAU DEFAULT STARTER
    function loadSavedResume() {
      const key = getStorageKey();
      const raw = localStorage.getItem(key);
      if (raw) {
        try {
          currentResume = JSON.parse(raw);
        } catch (e) {
          currentResume = getDefaultBlankData();
        }
      } else {
        const user = typeof GaeksAuth !== 'undefined' ? GaeksAuth.getCurrentUser() : null;
        if (user && (user.email === 'triawan25@gmail.com' || user.email === 'gaeks.group@gmail.com')) {
          currentResume = getSampleDenyData();
        } else {
          currentResume = getDefaultBlankData();
        }
      }
      populateForm();
      renderSheet();
    }

    function saveResume() {
      const key = getStorageKey();
      localStorage.setItem(key, JSON.stringify(currentResume));
      const statusEl = document.getElementById('save-status');
      if (statusEl) {
        statusEl.innerText = "✓ Tersimpan " + new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
      }
    }

    function getDefaultBlankData() {
      return {
        name: "",
        title: "",
        email: "",
        phone: "",
        location: "",
        linkedin: "",
        summary: "",
        skills: "Strategic Planning, Operational Leadership, Problem Solving",
        certifications: "",
        languages: "Bahasa Indonesia, English",
        theme: "theme-apex",
        experiences: [
          { role: "", company: "", period: "", location: "", desc: "" }
        ],
        educations: [
          { degree: "", school: "", year: "", gpa: "" }
        ]
      };
    }

    function getSampleDenyData() {
      return {
        name: "Deny Triawan",
        title: "Founder & Chief Executive Officer",
        email: "deny@gaeks.com",
        phone: "+62 812-8888-9999",
        location: "Jakarta & Banten, Indonesia",
        linkedin: "linkedin.com/in/denytriawan",
        summary: "Pemimpin eksekutif dan arsitek bisnis berpengalaman lebih dari 8 tahun dalam industri freight forwarding internasional, rantai pasok multimodal, dan transformasi ekosistem digital. Terbukti memimpin efisiensi operasional kepabeanan dan pembangunan platform ERP terintegrasi.",
        skills: "International Freight Forwarding, Customs Brokerage (PPJK), Multi-modal Logistics, ERP & Cloud Architecture, Enterprise Leadership, Supply Chain Risk Mitigation",
        certifications: "Ahli Kepabeanan (PPJK BPPK Kemenkeu RI), Certified Supply Chain & Logistics Operations",
        languages: "Bahasa Indonesia (Native), English (Professional)",
        theme: "theme-apex",
        experiences: [
          {
            role: "Founder & Chief Executive Officer",
            company: "GAEKS GROUP (Freight International & Digital Ecosystem)",
            period: "2023 - Sekarang",
            location: "Jakarta, Indonesia",
            desc: "Memimpin visi strategis dan ekspansi korporasi mencakup layanan freight forwarding global, customs clearance, dan platform ERP digital modern.\\n• Mengakselerasi pertumbuhan volume kargo laut dan udara hingga 45% YoY.\\n• Mengarsiteki ekosistem digital GAEKS (erp.gaeks.com, smm.gaeks.com, gdp.gaeks.com)."
          },
          {
            role: "Head of Operations & Logistics Manager",
            company: "PT Milenial Solusi Internusa",
            period: "2019 - 2023",
            location: "Jakarta, Indonesia",
            desc: "Mengawasi operasional pergudangan, kepabeanan ekspor-impor, dan manajemen vendor trucking darat serta keagenan kapal pelabuhan.\\n• Mereduksi dwell time kontainer impor dan memitigasi risiko demurrage hingga 30%."
          }
        ],
        educations: [
          {
            degree: "Sarjana Teknik (S.T.) - Manajemen Sistem Informasi & Logistik",
            school: "Universitas Terkemuka Indonesia",
            year: "2018",
            gpa: "3.75 / 4.00"
          }
        ]
      };
    }

    function createNewCV() {
      if (confirm("Buat lembar kerja CV baru yang kosong? Data saat ini akan diperbarui.")) {
        currentResume = getDefaultBlankData();
        populateForm();
        renderSheet();
        saveResume();
        switchTab('profile');
      }
    }

    function loadSampleDeny() {
      currentResume = getSampleDenyData();
      populateForm();
      renderSheet();
      saveResume();
      switchTab('profile');
    }

    function populateForm() {
      document.getElementById('f-name').value = currentResume.name || "";
      document.getElementById('f-title').value = currentResume.title || "";
      document.getElementById('f-email').value = currentResume.email || "";
      document.getElementById('f-phone').value = currentResume.phone || "";
      document.getElementById('f-location').value = currentResume.location || "";
      document.getElementById('f-linkedin').value = currentResume.linkedin || "";
      document.getElementById('f-summary').value = currentResume.summary || "";
      document.getElementById('f-skills').value = currentResume.skills || "";
      document.getElementById('f-certifications').value = currentResume.certifications || "";
      document.getElementById('f-languages').value = currentResume.languages || "";
      document.getElementById('theme-selector').value = currentResume.theme || "theme-apex";
      
      renderExperienceInputs();
      renderEducationInputs();
    }

    function updateCvData() {
      currentResume.name = document.getElementById('f-name').value;
      currentResume.title = document.getElementById('f-title').value;
      currentResume.email = document.getElementById('f-email').value;
      currentResume.phone = document.getElementById('f-phone').value;
      currentResume.location = document.getElementById('f-location').value;
      currentResume.linkedin = document.getElementById('f-linkedin').value;
      currentResume.summary = document.getElementById('f-summary').value;
      currentResume.skills = document.getElementById('f-skills').value;
      currentResume.certifications = document.getElementById('f-certifications').value;
      currentResume.languages = document.getElementById('f-languages').value;

      renderSheet();
      saveResume();
    }

    function changeTheme(themeClass) {
      currentResume.theme = themeClass;
      const sheet = document.getElementById('a4-sheet');
      sheet.className = "a4-sheet " + themeClass + " p-10 sm:p-12 cv-font transition-all duration-300";
      saveResume();
    }

    // EXP RENDER
    function renderExperienceInputs() {
      const container = document.getElementById('experience-list-container');
      container.innerHTML = "";
      currentResume.experiences.forEach((exp, idx) => {
        const div = document.createElement('div');
        div.className = "p-3.5 bg-slate-950 rounded-xl border border-slate-800 space-y-2 relative";
        div.innerHTML = `
          <button type="button" onclick="removeExperience(${idx})" class="absolute top-2 right-2 text-rose-400 hover:text-rose-300 text-xs font-bold cursor-pointer">✕ Hapus</button>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[10px] text-slate-400">Jabatan / Role</label>
              <input type="text" value="${exp.role || ''}" oninput="updateExpField(${idx}, 'role', this.value)" placeholder="CEO / Manager" class="w-full px-2.5 py-1.5 text-xs bg-slate-900 border border-slate-800 rounded text-white focus:border-blue-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-[10px] text-slate-400">Perusahaan</label>
              <input type="text" value="${exp.company || ''}" oninput="updateExpField(${idx}, 'company', this.value)" placeholder="PT Global Nusantara" class="w-full px-2.5 py-1.5 text-xs bg-slate-900 border border-slate-800 rounded text-white focus:border-blue-500 focus:outline-none">
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[10px] text-slate-400">Periode</label>
              <input type="text" value="${exp.period || ''}" oninput="updateExpField(${idx}, 'period', this.value)" placeholder="2021 - Sekarang" class="w-full px-2.5 py-1.5 text-xs bg-slate-900 border border-slate-800 rounded text-white focus:border-blue-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-[10px] text-slate-400">Lokasi</label>
              <input type="text" value="${exp.location || ''}" oninput="updateExpField(${idx}, 'location', this.value)" placeholder="Jakarta, Indonesia" class="w-full px-2.5 py-1.5 text-xs bg-slate-900 border border-slate-800 rounded text-white focus:border-blue-500 focus:outline-none">
            </div>
          </div>
          <div>
            <label class="block text-[10px] text-slate-400">Deskripsi & Pencapaian Kunci</label>
            <textarea rows="3" oninput="updateExpField(${idx}, 'desc', this.value)" placeholder="Gunakan tanda garis baru (Enter) untuk membuat poin pencapaian..." class="w-full px-2.5 py-1.5 text-xs bg-slate-900 border border-slate-800 rounded text-white focus:border-blue-500 focus:outline-none leading-relaxed">${exp.desc || ''}</textarea>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function addExperienceField() {
      currentResume.experiences.unshift({ role: "", company: "", period: "", location: "", desc: "" });
      renderExperienceInputs();
      renderSheet();
      saveResume();
    }

    function removeExperience(idx) {
      currentResume.experiences.splice(idx, 1);
      renderExperienceInputs();
      renderSheet();
      saveResume();
    }

    function updateExpField(idx, field, value) {
      currentResume.experiences[idx][field] = value;
      renderSheet();
      saveResume();
    }

    // EDU RENDER
    function renderEducationInputs() {
      const container = document.getElementById('education-list-container');
      container.innerHTML = "";
      currentResume.educations.forEach((edu, idx) => {
        const div = document.createElement('div');
        div.className = "p-3.5 bg-slate-950 rounded-xl border border-slate-800 space-y-2 relative";
        div.innerHTML = `
          <button type="button" onclick="removeEducation(${idx})" class="absolute top-2 right-2 text-rose-400 hover:text-rose-300 text-xs font-bold cursor-pointer">✕ Hapus</button>
          <div>
            <label class="block text-[10px] text-slate-400">Gelar & Jurusan</label>
            <input type="text" value="${edu.degree || ''}" oninput="updateEduField(${idx}, 'degree', this.value)" placeholder="Sarjana Teknik (S.T.) - Teknik Industri" class="w-full px-2.5 py-1.5 text-xs bg-slate-900 border border-slate-800 rounded text-white focus:border-blue-500 focus:outline-none">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[10px] text-slate-400">Universitas / Sekolah</label>
              <input type="text" value="${edu.school || ''}" oninput="updateEduField(${idx}, 'school', this.value)" placeholder="Institut Teknologi Bandung" class="w-full px-2.5 py-1.5 text-xs bg-slate-900 border border-slate-800 rounded text-white focus:border-blue-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-[10px] text-slate-400">Tahun Lulus</label>
              <input type="text" value="${edu.year || ''}" oninput="updateEduField(${idx}, 'year', this.value)" placeholder="2018" class="w-full px-2.5 py-1.5 text-xs bg-slate-900 border border-slate-800 rounded text-white focus:border-blue-500 focus:outline-none">
            </div>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function addEducationField() {
      currentResume.educations.push({ degree: "", school: "", year: "", gpa: "" });
      renderEducationInputs();
      renderSheet();
      saveResume();
    }

    function removeEducation(idx) {
      currentResume.educations.splice(idx, 1);
      renderEducationInputs();
      renderSheet();
      saveResume();
    }

    function updateEduField(idx, field, value) {
      currentResume.educations[idx][field] = value;
      renderSheet();
      saveResume();
    }

    // LIVE RENDER A4 CANVAS
    function renderSheet() {
      document.getElementById('r-name').innerText = currentResume.name.trim() || "NAMA LENGKAP ANDA";
      document.getElementById('r-title').innerText = currentResume.title.trim() || "Target Posisi / Profesi";

      // KONTAK
      const contacts = [];
      if (currentResume.location) contacts.push(currentResume.location);
      if (currentResume.phone) contacts.push(currentResume.phone);
      if (currentResume.email) contacts.push(currentResume.email);
      if (currentResume.linkedin) contacts.push(currentResume.linkedin);
      document.getElementById('r-contact').innerHTML = contacts.map(c => `<div>${c}</div>`).join('');

      // SUMMARY
      const secSummary = document.getElementById('sec-summary');
      const rSummary = document.getElementById('r-summary');
      if (currentResume.summary.trim()) {
        secSummary.classList.remove('hidden');
        rSummary.innerText = currentResume.summary;
      } else {
        secSummary.classList.add('hidden');
      }

      // EXP LIST
      const rExpList = document.getElementById('r-experience-list');
      const validExps = currentResume.experiences.filter(e => e.role.trim() || e.company.trim());
      if (validExps.length > 0) {
        document.getElementById('sec-experience').classList.remove('hidden');
        rExpList.innerHTML = validExps.map(e => {
          const descLines = (e.desc || "").split('\\n').filter(l => l.trim());
          const bulletsHtml = descLines.length > 0 
            ? `<ul class="list-disc list-outside ml-4 mt-1 space-y-0.5 text-slate-700 leading-relaxed">${descLines.map(l => `<li>${l}</li>`).join('')}</ul>` 
            : "";
          return `
            <div>
              <div class="flex justify-between items-baseline">
                <h3 class="text-xs font-bold text-slate-900">${e.role || 'Jabatan'}</h3>
                <span class="text-[11px] font-semibold text-slate-500">${e.period || ''}</span>
              </div>
              <div class="flex justify-between items-baseline text-[11px] text-slate-600 font-medium">
                <span>${e.company || ''}</span>
                <span>${e.location || ''}</span>
              </div>
              ${bulletsHtml}
            </div>
          `;
        }).join('');
      } else {
        document.getElementById('sec-experience').classList.add('hidden');
      }

      // EDU LIST
      const rEduList = document.getElementById('r-education-list');
      const validEdus = currentResume.educations.filter(e => e.degree.trim() || e.school.trim());
      if (validEdus.length > 0) {
        document.getElementById('sec-education').classList.remove('hidden');
        rEduList.innerHTML = validEdus.map(e => `
          <div class="flex justify-between items-baseline">
            <div>
              <h3 class="text-xs font-bold text-slate-900">${e.degree || 'Pendidikan'}</h3>
              <p class="text-[11px] text-slate-600">${e.school || ''}</p>
            </div>
            <span class="text-[11px] font-semibold text-slate-500">${e.year || ''}</span>
          </div>
        `).join('');
      } else {
        document.getElementById('sec-education').classList.add('hidden');
      }

      // SKILLS
      document.getElementById('r-skills').innerText = currentResume.skills || "";
      document.getElementById('r-certifications').innerText = currentResume.certifications || "";
      document.getElementById('r-languages').innerText = currentResume.languages || "";

      document.getElementById('r-skills-row').style.display = currentResume.skills.trim() ? "block" : "none";
      document.getElementById('r-cert-row').style.display = currentResume.certifications.trim() ? "block" : "none";
      document.getElementById('r-lang-row').style.display = currentResume.languages.trim() ? "block" : "none";
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('bg-blue-600', 'text-white');
        btn.classList.add('text-slate-400');
      });

      const activeContent = document.getElementById('tab-content-' + tabId);
      const activeBtn = document.getElementById('tab-btn-' + tabId);
      if (activeContent) activeContent.classList.remove('hidden');
      if (activeBtn) {
        activeBtn.classList.add('bg-blue-600', 'text-white');
        activeBtn.classList.remove('text-slate-400');
      }
    }
  </script>
</body>
</html>

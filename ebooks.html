<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Katalog E-book | GAEKS</title><script src="https://cdn.tailwindcss.com"></script><body class="bg-slate-950 text-white"><main class="max-w-6xl mx-auto p-6 md:p-12"><a href="index.html" class="text-slate-400">← GAEKS Digital</a><p class="mt-10 text-indigo-300 font-bold tracking-widest text-xs">DIGITAL LIBRARY</p><h1 class="text-5xl font-black mt-3">E-book untuk bekerja lebih tajam.</h1><p class="text-slate-400 mt-4 max-w-2xl">Pilihan panduan digital profesional. Pembayaran aman akan tersedia setelah checkout Midtrans diaktifkan.</p><div id="books" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6 mt-12"></div></main><script>fetch('/api/ebooks.php?action=catalog',{headers:{Accept:'application/json'}}).then(r=>r.json()).then(x=>{books.innerHTML=(x.data||[]).map(b=>`<article class="rounded-3xl bg-slate-900 border border-slate-800 overflow-hidden"><div class="h-44 bg-gradient-to-br from-indigo-600 to-fuchsia-700">${b.coverUrl?`<img class="w-full h-full object-cover" src="${b.coverUrl}">`:''}</div><div class="p-6"><h2 class="font-bold text-xl">${b.title}</h2><p class="text-slate-400 text-sm mt-3 line-clamp-3">${b.description}</p><div class="mt-6 flex justify-between items-center"><b>Rp${b.priceIdr.toLocaleString('id-ID')}</b><button disabled class="text-xs rounded-lg px-3 py-2 bg-slate-800 text-slate-400">Segera hadir</button></div></div></article>`).join('')||'<p class="text-slate-400">Belum ada e-book yang dipublikasikan.</p>'})</script></body></html>

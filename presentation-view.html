<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Presentasi | GAEKS</title><script src="https://cdn.tailwindcss.com"></script><body class="bg-slate-950 text-white min-h-screen"><main class="min-h-screen flex flex-col"><header class="p-5 flex justify-between text-sm"><b>GAEKS · VIEW ONLY</b><span id="count"></span></header><section class="flex-1 flex items-center justify-center p-5"><article id="slide" class="w-full max-w-6xl min-h-[65vh] rounded-[2rem] bg-white text-slate-900 p-10 md:p-16 shadow-2xl transition-all duration-500"></article></section><footer class="p-5 flex justify-center gap-4"><button id="prev" class="px-5 py-3 rounded-xl bg-slate-800">← Sebelumnya</button><button id="next" class="px-5 py-3 rounded-xl bg-indigo-600">Berikutnya →</button></footer></main><script>let p,i=0;const e=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pages=()=>[{c:1},{a:1},...(p.slides||[]).map(s=>({s})),{t:1}];function draw(){let a=pages(),x=a[i];count.textContent=`${i+1} / ${a.length}`;prev.disabled=!i;next.disabled=i===a.length-1;slide.classList.add('opacity-0','translate-y-3');setTimeout(()=>{slide.classList.remove('opacity-0','translate-y-3');if(x.c){slide.className='w-full max-w-6xl min-h-[65vh] rounded-[2rem] bg-gradient-to-br from-indigo-700 to-slate-950 text-white p-10 md:p-16 shadow-2xl transition-all duration-500 flex flex-col justify-center';slide.innerHTML=`<p class="tracking-[.3em] text-indigo-200">PRESENTATION</p><h1 class="text-5xl md:text-7xl font-black mt-5">${e(p.meetingName)}</h1><p class="mt-6 text-xl text-slate-200">${e(p.meetingDate)} · ${e(p.authorName)}</p>`}else if(x.a){slide.className='w-full max-w-6xl min-h-[65vh] rounded-[2rem] bg-white text-slate-900 p-10 md:p-16 shadow-2xl transition-all duration-500';slide.innerHTML=`<h2 class="text-4xl font-black">Agenda</h2><ol class="mt-8 space-y-4">${p.slides.map((s,n)=>`<li class="text-xl"><b>${n+1}.</b> ${e(s.title)}</li>`).join('')}</ol>`}else if(x.t){slide.className='w-full max-w-6xl min-h-[65vh] rounded-[2rem] bg-slate-900 text-white p-10 md:p-16 shadow-2xl transition-all duration-500 flex items-center justify-center';slide.innerHTML='<h2 class="text-5xl font-black">Terima kasih</h2>'}else{let s=x.s;slide.className='w-full max-w-6xl min-h-[65vh] rounded-[2rem] bg-white text-slate-900 p-10 md:p-16 shadow-2xl transition-all duration-500';slide.innerHTML=`<p class="text-indigo-600 font-bold">SLIDE ${i-1}</p><h2 class="text-4xl font-black mt-3">${e(s.title)}</h2><div class="mt-8 space-y-5">${(s.points||[]).map(q=>`<div><b class="text-xl">${e(q.title)}</b><p class="text-slate-600 mt-1">${e(q.desc)}</p></div>`).join('')}</div>`}},120)}prev.onclick=()=>{if(i){--i;draw()}};next.onclick=()=>{if(i<pages().length-1){++i;draw()}};addEventListener('keydown',z=>{if(z.key==='ArrowLeft')prev.click();if(z.key==='ArrowRight')next.click()});fetch('/api/presentation.php?action=public&token='+encodeURIComponent(new URLSearchParams(location.search).get('token')||''),{headers:{Accept:'application/json'}}).then(r=>r.json()).then(x=>{if(!x.ok)throw 0;p=x.data.presentation;draw()}).catch(()=>slide.innerHTML='<h1 class="text-3xl font-black">Presentasi tidak tersedia</h1>');</script></body></html>

<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Presentasi | GAEKS</title><script src="https://cdn.tailwindcss.com"></script><body class="bg-slate-950 text-white min-h-screen"><main class="max-w-5xl mx-auto p-6"><p class="text-xs text-indigo-300 font-bold">GAEKS · PUBLIC VIEW</p><h1 id="title" class="text-4xl font-black mt-2">Memuat presentasi…</h1><p id="meta" class="text-slate-400 mt-2"></p><div id="slides" class="grid gap-6 mt-10"></div></main><script>const t=new URLSearchParams(location.search).get('token');fetch('/api/presentation.php?action=public&token='+encodeURIComponent(t||''),{headers:{Accept:'application/json'}}).then(r=>r.json()).then(x=>{if(!x.ok)throw Error(x.message);const p=x.data.presentation;title.textContent=p.meetingName;meta.textContent=p.meetingDate||'';slides.innerHTML=(p.slides||[]).map((s,i)=>`<article class="rounded-3xl bg-white text-slate-900 p-8 shadow-2xl"><p class="text-indigo-600 text-sm font-bold">${String(i+1).padStart(2,'0')}</p><h2 class="text-3xl font-extrabold mt-2">${s.title||''}</h2><div class="mt-5 space-y-3">${(s.points||[]).map(q=>`<div><b>${q.title||''}</b><p class="text-slate-600">${q.desc||''}</p></div>`).join('')}</div></article>`).join('')||'<p>Tidak ada slide.</p>'}).catch(e=>{title.textContent='Presentasi tidak tersedia';meta.textContent='Link salah atau telah dinonaktifkan.'});</script></body></html>

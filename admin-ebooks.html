<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin E-book | GAEKS</title><script src="https://cdn.tailwindcss.com"></script><script src="auth.js"></script><body class="bg-slate-950 text-white"><main class="max-w-3xl mx-auto p-6 md:p-12"><h1 class="text-3xl font-black">Katalog E-book</h1><p class="text-slate-400 mt-2">Admin · upload file disimpan privat di server.</p><form id="form" class="mt-8 grid gap-4 bg-slate-900 p-6 rounded-2xl" enctype="multipart/form-data"><input name="title" required placeholder="Judul e-book" class="p-3 rounded bg-slate-800"><textarea name="description" required placeholder="Deskripsi" class="p-3 rounded bg-slate-800"></textarea><input name="priceIdr" required type="number" min="0" placeholder="Harga IDR" class="p-3 rounded bg-slate-800"><label>Cover <input name="cover" type="file" accept="image/*"></label><label>File e-book (PDF/EPUB) <input name="file" required type="file" accept=".pdf,.epub"></label><select name="status" class="p-3 rounded bg-slate-800"><option value="draft">Draft</option><option value="published">Publikasikan</option></select><button class="p-3 rounded bg-indigo-600 font-bold">Tambah e-book</button><p id="msg"></p></form></main><script>GaeksAuth.ready.then(u=>{if(!u?.isAdmin)location.replace('index.html')});form.onsubmit=async e=>{e.preventDefault();let f=new FormData(form);f.append('action','create');try{let r=await fetch('/api/ebooks.php?action=create',{method:'POST',credentials:'same-origin',headers:{'X-CSRF-Token':document.cookie.match(/(?:^|; )gaeks_csrf=([^;]+)/)?.[1]||''},body:f});let x=await r.json();if(!x.ok)throw Error(x.message);msg.textContent='E-book berhasil ditambahkan.';form.reset()}catch(e){msg.textContent=e.message}}</script></body></html>
